---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
    env: dev
    release: v1.1
spec:
  containers:
    - name: nginx-pod
      image: nginx:1.28
      ports:
        - containerport: 80
          protocol: TCP
    - name: logagent
      image: alpine
      args:
        - sleep
        - 1d
